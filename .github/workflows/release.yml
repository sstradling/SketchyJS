name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish nothing and create no tags
        type: boolean
        default: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse anything that is not a green CI push on this repository's master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.event }}" = "push"
            test "${{ github.event.workflow_run.head_branch }}" = "master"
            test "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}"
          else
            test "${{ github.ref }}" = "refs/heads/master"
            conclusion=$(gh run list --repo "${{ github.repository }}" --workflow CI --branch master --commit "${{ github.sha }}" --json conclusion --jq '.[0].conclusion')
            test "$conclusion" = "success"
          fi

  verify:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm size
      - run: node scripts/publish-dry-run.mjs
      - run: node scripts/release-dry-run.mjs
      - run: pnpm smoke:exports

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Gate, version, publish, then tag and create the GitHub Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "master"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-dry-run.mjs --gate
          pnpm changeset version
          node scripts/release-dry-run.mjs --gate
          git add -A
          git diff --cached --quiet && echo "version commit already present" || git commit -m "Version packages"
          git push origin HEAD
          pnpm changeset publish
          version=$(node -p "require('./packages/core/package.json').version")
          test "$version" = "1.6.0"
          git tag -a "v$version" -m "SketchyJS $version"
          git push origin "v$version"
          gh release create "v$version" --title "SketchyJS $version" --generate-notes
