name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish nothing and create no tags
        type: boolean
        default: true
      version:
        description: Package version already on this commit, for example 1.6.0
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse anything that is not a green CI push on this repository's master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.event }}" = "push"
            test "${{ github.event.workflow_run.head_branch }}" = "master"
            test "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}"
          else
            test "${{ github.ref }}" = "refs/heads/master"
            conclusion=$(gh run list --repo "${{ github.repository }}" --workflow CI --branch master --commit "${{ github.sha }}" --json conclusion --jq '.[0].conclusion')
            test "$conclusion" = "success"
          fi

  verify:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm size
      - run: node scripts/publish-dry-run.mjs
      - run: node scripts/release-dry-run.mjs
      - run: pnpm smoke:exports

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Gate, publish, then tag and create the GitHub Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "master"
          expected="${{ inputs.version }}"
          test -n "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The release PR already ran `changeset version`, so this commit carries
          # the version and has no pending changesets. This job does not version again.
          node scripts/release-dry-run.mjs --gate --expect "$expected"
          publish_status=0
          pnpm changeset publish || publish_status=$?
          if [ "$publish_status" -ne 0 ]; then
            missing=0
            for manifest in packages/*/package.json; do
              private=$(node -p "require('./$manifest').private === true")
              if [ "$private" = "true" ]; then
                continue
              fi
              name=$(node -p "require('./$manifest').name")
              ver=$(node -p "require('./$manifest').version")
              if ! npm view "${name}@${ver}" version >/dev/null 2>&1; then
                echo "$name@$ver is not on the registry"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit "$publish_status"
            fi
            echo "changeset publish exited $publish_status; every package version is already published"
          fi
          version=$(node -p "require('./packages/core/package.json').version")
          test "$version" = "$expected"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q "refs/tags/v${version}$"; then
            echo "tag v$version already exists"
          else
            git tag -a "v$version" -m "SketchyJS $version"
            git push origin "refs/tags/v$version"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "GitHub Release v$version already exists"
          else
            gh release create "v$version" --title "SketchyJS $version" --generate-notes
          fi
