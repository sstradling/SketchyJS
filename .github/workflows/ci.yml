name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: node scripts/publish-dry-run.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schemas:check
      - run: pnpm fixtures:verify
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - run: pnpm fixtures:regen -- --check
      - run: pnpm smoke:exports
      - run: node scripts/release-dry-run.mjs
      - run: pnpm size
      - run: pnpm docs:api
      - name: actionlint
        if: matrix.node == 22
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
