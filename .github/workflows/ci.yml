name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schemas:check
      - run: pnpm fixtures:verify
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - run: pnpm fixtures:regen -- --check --allow-missing-swift
      - run: pnpm smoke:exports
      - run: pnpm size
      - run: pnpm docs:api
